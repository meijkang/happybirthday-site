<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>路线图地标预览</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eaf3ef; font-family: "Microsoft YaHei", sans-serif; }
  main { width: min(92vw, 960px); padding: 24px; background: #fffdf6; border: 3px solid #2b2622; border-radius: 20px; box-shadow: 0 6px 0 rgba(43,38,34,.2); }
  h1 { margin: 0 0 18px; font-size: 22px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
  figure { margin: 0; padding: 10px; text-align: center; border: 3px solid #2b2622; border-radius: 14px; background: #fff; }
  button { width: 120px; margin: 0 auto; padding: 6px; border: 3px solid #2b2622; border-radius: 12px; background: #fffdf6; cursor: default; }
  svg { display: block; width: 100%; height: auto; }
  figcaption { margin-top: 8px; font-size: 18px; }
</style>
</head>
<body>
<main>
  <h1>路线图地标预览（改 js/route.js 后强刷）</h1>
  <div class="grid" id="grid"></div>
</main>
<script>window.ANNIV_CONFIG={route:[]};</script>
<script src="js/route.js"></script>
<script>
  (function () {
    var grid = document.getElementById('grid');
    Object.keys(window.ANNIV_ROUTE_ICONS).forEach(function (city) {
      var fig = document.createElement('figure');
      fig.innerHTML = '<button><svg viewBox="0 0 40 30" aria-hidden="true">' + window.ANNIV_ROUTE_ICONS[city] + '</svg></button><figcaption></figcaption>';
      fig.querySelector('figcaption').textContent = city;
      grid.appendChild(fig);
    });
  })();
</script>
</body>
</html>
